namespace: recruitment

image:
  registry: acrrecruitmentprod.azurecr.io
  name: retail-recruitment
  tag: "9"
  pullPolicy: IfNotPresent

api:
  name: recruitment-api
  replicaCount: 2
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

ui:
  name: recruitment-ui
  replicaCount: 2
  port: 80
  serviceType: LoadBalancer
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# Application configuration (from .env)
config:
  LOG_LEVEL: info
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: capsule_db
  DB_USER: capsule_user

# Application secrets (DEV ONLY)
secrets:
  DB_PASSWORD: secure_password_123

# =========================
# MySQL Database Configuration
# =========================
mysql:
  name: mysql
  image: mysql:8.0
  port: 3306

  database:
    name: capsule_db
    user: capsule_user
    password: secure_password_123
    rootPassword: rootpassword123

  persistence:
    enabled: true
    size: 10Gi
    storageClass: azure-disk-sc
