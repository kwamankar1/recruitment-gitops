apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recruitment
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kwamankar1/recruitment-gitops.git
    targetRevision: main
    path: helm/recruitment
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: recruitment

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
